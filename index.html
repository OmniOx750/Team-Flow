<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>TEAM FLOW | 일정·업무 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <strong>TEAM FLOW</strong>
          <span>일정·업무 관리</span>
        </div>
      </div>

      <nav class="nav-list" aria-label="주요 메뉴">
        <button class="nav-item active" data-view="dashboard">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.6l8.5 7.2v8.7a1.5 1.5 0 0 1-1.5 1.5h-4.8v-6.2H9.8V21H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span><span>대시보드</span>
        </button>
        <button class="nav-item" data-view="tasks">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 2.5 2.5L16.5 8.5"/></svg></span><span>전체 업무</span>
        </button>
        <button class="nav-item" data-view="mine">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"/></svg></span><span>내 업무</span>
        </button>
        <button class="nav-item" data-view="calendar">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="3"/><path d="M7.5 3v5M16.5 3v5M3.5 10h17"/></svg></span><span>주간 일정</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="profile-mini">
          <div class="avatar" id="profileAvatar">나</div>
          <div>
            <strong id="profileName">사용자 선택</strong>
            <span id="profileTeam">팀 공용</span>
          </div>
        </div>
        <label class="sidebar-select-label" for="currentUserSelect">내 이름</label>
        <select class="sidebar-select" id="currentUserSelect" aria-label="현재 사용자 선택"></select>
        <button class="text-button" id="changeAccessKeyBtn">팀 접속키 변경</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenuBtn" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
        <div>
          <p class="eyebrow" id="todayLabel"></p>
          <h1 id="pageTitle">업무 대시보드</h1>
        </div>
        <div class="topbar-actions">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2"/></svg></span>
            <input id="globalSearch" type="search" placeholder="업무명, 담당자 검색" />
          </label>
          <button class="primary-button" id="openTaskModalBtn">＋ 새 업무</button>
        </div>
      </header>

      <section class="connection-banner" id="connectionBanner" aria-live="polite">
        <div class="connection-copy">
          <span class="connection-dot" id="connectionDot"></span>
          <div>
            <strong id="connectionLabel">Google Sheets 연결 확인 중</strong>
            <span id="lastSyncLabel">잠시만 기다려 주세요.</span>
          </div>
        </div>
        <button class="sync-button" id="refreshDataBtn" type="button">↻ 새로고침</button>
      </section>

      <section class="filter-row">
        <div class="segmented" id="periodSegment">
          <button class="active" data-period="week">이번 주</button>
          <button data-period="month">이번 달</button>
          <button data-period="all">전체</button>
        </div>
        <div class="filter-controls">
          <select id="assigneeFilter" aria-label="담당자 필터">
            <option value="all">담당자 전체</option>
          </select>
          <select id="statusFilter" aria-label="상태 필터">
            <option value="all">상태 전체</option>
            <option value="before">진행 전</option>
            <option value="progress">진행 중</option>
            <option value="completed">완료</option>
            <option value="hold">보류</option>
            <option value="delayed">지연</option>
          </select>
        </div>
      </section>

      <section id="dashboardView" class="view active">
        <div class="summary-grid" id="summaryCards"></div>

        <div class="dashboard-grid top-grid">
          <article class="panel focus-panel">
            <div class="panel-header">
              <div>
                <span class="section-kicker">FOCUS</span>
                <h2>오늘·이번 주 해야 할 일</h2>
              </div>
              <button class="panel-link" data-jump="mine">내 업무 전체 보기</button>
            </div>
            <div id="focusTaskList" class="focus-list"></div>
          </article>

          <article class="panel project-panel">
            <div class="panel-header">
              <div>
                <span class="section-kicker">PROJECTS</span>
                <h2>주요 프로젝트 진행률</h2>
              </div>
            </div>
            <div id="projectProgressList" class="project-list"></div>
          </article>
        </div>

        <article class="panel timeline-panel">
          <div class="panel-header wrap-header">
            <div>
              <span class="section-kicker">WEEKLY TIMELINE</span>
              <h2>이번 주 업무 타임라인</h2>
            </div>
            <div class="legend">
              <span><i class="dot before"></i>진행 전</span>
              <span><i class="dot progress"></i>진행 중</span>
              <span><i class="dot completed"></i>완료</span>
              <span><i class="dot delayed"></i>지연</span>
            </div>
          </div>
          <div id="weeklyTimeline" class="timeline-wrap"></div>
        </article>

        <div class="dashboard-grid bottom-grid">
          <article class="panel">
            <div class="panel-header">
              <div>
                <span class="section-kicker">TEAM</span>
                <h2>팀원별 업무 현황</h2>
              </div>
            </div>
            <div class="table-scroll">
              <table class="team-table">
                <thead>
                  <tr>
                    <th>담당자</th>
                    <th>진행 전</th>
                    <th>진행 중</th>
                    <th>이번 주 마감</th>
                    <th>지연</th>
                  </tr>
                </thead>
                <tbody id="teamStatusBody"></tbody>
              </table>
            </div>
          </article>

          <article class="panel status-panel">
            <div class="panel-header">
              <div>
                <span class="section-kicker">STATUS</span>
                <h2>업무 상태 분포</h2>
              </div>
            </div>
            <div class="status-chart-area">
              <div class="donut" id="statusDonut"><div><strong id="donutTotal">0</strong><span>전체 업무</span></div></div>
              <div id="statusLegend" class="status-legend"></div>
            </div>
          </article>
        </div>
      </section>

      <section id="taskListView" class="view">
        <article class="panel task-list-panel">
          <div class="panel-header wrap-header">
            <div>
              <span class="section-kicker">TASKS</span>
              <h2 id="taskListTitle">전체 업무</h2>
            </div>
            <div class="view-switcher">
              <button class="active" data-task-layout="list">목록</button>
              <button data-task-layout="board">보드</button>
            </div>
          </div>
          <div id="taskListContainer"></div>
        </article>
      </section>

      <section id="calendarView" class="view">
        <article class="panel calendar-panel">
          <div class="panel-header">
            <div>
              <span class="section-kicker">WEEKLY</span>
              <h2>주간 일정</h2>
            </div>
            <div class="week-nav">
              <button id="prevWeekBtn" aria-label="이전 주">‹</button>
              <strong id="weekRangeLabel"></strong>
              <button id="nextWeekBtn" aria-label="다음 주">›</button>
              <button id="todayWeekBtn">이번 주</button>
            </div>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </article>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="taskModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
      <div class="modal-header">
        <div>
          <span class="section-kicker">TASK</span>
          <h2 id="taskModalTitle">새 업무 등록</h2>
        </div>
        <button class="icon-button" id="closeTaskModalBtn" aria-label="닫기">×</button>
      </div>

      <form id="taskForm">
        <input type="hidden" id="taskId" />
        <div class="form-grid">
          <label class="full-field">
            <span>업무명 *</span>
            <input id="taskTitle" required maxlength="80" placeholder="예: ERS 부스 그래픽 최종 전달" />
          </label>
          <label>
            <span>프로젝트 *</span>
            <input id="taskProject" required list="projectOptions" placeholder="예: ERS 2026" />
            <datalist id="projectOptions"></datalist>
          </label>
          <label>
            <span>담당자 *</span>
            <select id="taskAssignee" required></select>
          </label>
          <label>
            <span>시작일 *</span>
            <input id="taskStart" type="date" required />
          </label>
          <label>
            <span>종료일 *</span>
            <input id="taskEnd" type="date" required />
          </label>
          <label>
            <span>상태 *</span>
            <select id="taskStatus" required>
              <option value="before">진행 전</option>
              <option value="progress">진행 중</option>
              <option value="completed">완료</option>
              <option value="hold">보류</option>
            </select>
          </label>
          <label>
            <span>우선순위</span>
            <select id="taskPriority">
              <option value="normal">보통</option>
              <option value="high">높음</option>
              <option value="urgent">긴급</option>
              <option value="low">낮음</option>
            </select>
          </label>
          <label class="full-field">
            <span>진행률 <b id="progressValue">0%</b></span>
            <input id="taskProgress" type="range" min="0" max="100" step="5" value="0" />
          </label>
          <label class="full-field">
            <span>업무 내용</span>
            <textarea id="taskDescription" rows="4" maxlength="500" placeholder="업무 범위, 전달 사항, 확인할 내용 등을 입력하세요."></textarea>
          </label>
          <label class="full-field">
            <span>관련 링크</span>
            <input id="taskLink" type="url" placeholder="https://" />
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="danger-button hidden" id="deleteTaskBtn">업무 삭제</button>
          <div class="action-spacer"></div>
          <button type="button" class="secondary-button" id="cancelTaskBtn">취소</button>
          <button type="submit" class="primary-button" id="saveTaskBtn">저장</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
